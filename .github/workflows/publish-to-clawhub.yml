name: Publish to ClawHub

on:
  push:
    branches:
      - main
    paths:
      - SKILL.md
      - references/**
      - .github/workflows/publish-to-clawhub.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from SKILL.md
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *//p' SKILL.md)
          echo "version=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION:-1.0.0}"

      - name: Login to ClawHub
        run: npx clawhub login --no-browser --token "${{ secrets.CLAWHUB_TOKEN }}"

      - name: Publish to ClawHub
        run: |
          npx clawhub publish . \
            --slug pecmd-pro-max \
            --version "${{ steps.version.outputs.version }}" \
            --tags "pecmd,winpe,scripting,windows,system-tools,automation" \
            --no-input
